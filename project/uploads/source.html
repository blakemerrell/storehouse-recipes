    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
                font-size: 8.5pt;
            }
            .print-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .recipe-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                background: white !important;
                margin-bottom: 0.5rem !important;
                padding: 0.5rem !important;
            }
            .section-header {
                break-before: auto;
                page-break-before: auto;
                margin-top: 1rem !important;
                border-bottom: 2px solid #0f172a !important;
            }
            .grid-layout {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 0.5rem !important;
            }
        }
    </style>
</head>

            { id: 180, book: 2, section: "Book 2 - Section 4: Elaborate Sunday Feasts & Roasts", name: "Dutch Oven Beef Stew with Fluffy Drop Biscuits", servings: "6 Large Feast Servings", ing: "2 lbs stewing beef, 2 lbs potatoes, 1 lb carrots, 1 onion, 2 cups flour, 1 tbsp baking powder, ¾ cup milk, 4 tbsp butter.", prep: "1. Simmer beef, potatoes, carrots, onions in 3 cups water in Dutch oven 1 hour. 2. Make biscuit dough. 3. Drop biscuit dough on stew; bake uncovered at 375°F for 20 mins.", macro: "Biscuit Top Stew", diff: "In-Depth", time: "1 hr 20 mins", score: 89, extras: null },

        let currentBookFilter = 'all';

        function setBookFilter(book) {
            currentBookFilter = book;
            
            // Toggle active tab buttons
            document.getElementById('btn-all').className = book === 'all' ? "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-950 bg-amber-400 font-extrabold shadow transition" : "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition";
            document.getElementById('btn-b1').className = book === 1 ? "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-950 bg-amber-400 font-extrabold shadow transition" : "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition";
            document.getElementById('btn-b2').className = book === 2 ? "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-950 bg-amber-400 font-extrabold shadow transition" : "flex-1 lg:flex-none px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition";

            // Update main title header based on book
            const titleEl = document.getElementById('active-book-title');
            if (book === 1) {
                titleEl.textContent = "Book 1: Personal Fitness & Strength Cut Manual";
            } else if (book === 2) {
                titleEl.textContent = "Book 2: Family Delight Meal Planning Manual";
            } else {
                titleEl.textContent = "Bishops' Storehouse Master Recipe Collection";
            }

            renderRecipes();
        }

        function renderRecipes() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const diffVal = document.getElementById('diff-filter').value;
            const pantryVal = document.getElementById('pantry-filter').value;
            
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            let filtered = recipes.filter(r => {
                const matchesBook = currentBookFilter === 'all' || r.book === currentBookFilter;
                const matchesSearch = r.name.toLowerCase().includes(query) || r.ing.toLowerCase().includes(query) || r.section.toLowerCase().includes(query);
                
                let matchesDiff = true;
                if (diffVal !== 'all') {
                    matchesDiff = r.diff === diffVal;
                }

                let matchesPantry = true;
                if (pantryVal === 'base') {
                    matchesPantry = !r.extras;
                } else if (pantryVal === 'extras') {
                    matchesPantry = !!r.extras;
                }

                return matchesBook && matchesSearch && matchesDiff && matchesPantry;
            });

            // Update total active counter badge
            document.getElementById('recipe-count-badge').textContent = `${filtered.length} Recipes Shown`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-500 bg-white rounded-xl shadow-sm border border-slate-200 font-medium">No matching recipes found. Try adjusting your search query or filter tags.</div>`;
                return;
            }

            // Group by section
            const sections = {};
            filtered.forEach(r => {
                if (!sections[r.section]) sections[r.section] = [];
                sections[r.section].push(r);
            });

            for (const [sectionTitle, recipeGroup] of Object.entries(sections)) {
                let sectionHTML = `
                    <div class="mb-8">
                        <h2 class="section-header text-lg font-bold text-slate-900 border-b-2 border-slate-800 pb-1.5 mb-4 flex justify-between items-center">
                            <span>${sectionTitle}</span>
                            <span class="text-xs font-normal text-slate-500">(${recipeGroup.length} items)</span>
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 grid-layout">
                `;

                recipeGroup.forEach(r => {
                    // Smart Badge: Difficulty Badge
                    let diffBadge = `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">⚡ Easy (${r.time})</span>`;
                    if (r.diff === 'Medium') {
                        diffBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-200">🍳 Medium (${r.time})</span>`;
                    } else if (r.diff === 'In-Depth') {
                        diffBadge = `<span class="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-purple-200">👑 In-Depth (${r.time})</span>`;
                    }

                    // Smart Badge: Health/Fitness Score Badge
                    const scoreBadge = `<span class="bg-blue-50 text-blue-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-blue-200">💚 Score: ${r.score}</span>`;

                    // Smart Badge: Servings Badge
                    const servingsBadge = `<span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-300">🍽️ ${r.servings || '1 Serving'}</span>`;

                    // Smart Badge: Pantry Extras Badge (ONLY displayed if extras exist!)
                    let pantryBadge = r.extras 
                        ? `<span class="bg-rose-50 text-rose-700 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-rose-200" title="Requires items not on standard storehouse list">🛒 Extra: ${r.extras}</span>`
                        : '';

                    sectionHTML += `
                        <div class="recipe-card bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition">
                            <div>
                                <!-- Top Smart Badges Row -->
                                <div class="flex flex-wrap items-center gap-1.5 mb-2.5">
                                    <span class="text-xs font-bold text-slate-400">#${r.id}</span>
                                    ${diffBadge}
                                    ${scoreBadge}
                                    ${servingsBadge}
                                    ${pantryBadge}
                                </div>

                                <h3 class="font-extrabold text-slate-900 text-base mb-2 tracking-tight">${r.name}</h3>
                                
                                <div class="text-xs text-slate-700 mb-2 leading-relaxed">
                                    <strong class="text-slate-900">Ingredients:</strong> ${r.ing}
                                </div>
                                <div class="text-xs text-slate-600 mb-3 leading-relaxed">
                                    <strong class="text-slate-900">Step-by-Step Instructions:</strong><br>${r.prep}
                                </div>
                            </div>

                            <div class="pt-2 border-t border-slate-100 text-xs font-bold text-amber-700 flex justify-between items-center">
                                <span>📊 ${r.macro}</span>
                            </div>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            }
        }

        // Initialize on page load
        window.onload = renderRecipes;
    </script>
</body>
</html>
