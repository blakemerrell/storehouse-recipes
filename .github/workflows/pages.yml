# Publishes the app to GitHub Pages on every push to main.
#
# The `enablement: true` below is the useful part: it switches Pages on for the
# repository from inside the run, so nobody has to go into Settings to do it.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The newest push wins. This used to say cancel-in-progress: false, on the
# reasoning that a running deploy should finish rather than be cut off
# half-published — which sounds careful and was wrong. Deployments to an
# environment are serialized, so one run that hangs does not merely finish
# late: every later run queues behind it and waits. That is exactly what
# happened — a deploy timed out holding the lock, and the two pushes after it
# sat in Waiting indefinitely while the site stayed on the old build with no
# error anywhere the app could show.
#
# There is nothing to protect here anyway. The site is static files; a
# superseded deploy has no half-written state to leave behind, and the run
# that cancels it is publishing the newer commit regardless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A deploy of a few megabytes of static files takes about a minute. Ten is
    # already generous, and the point is that a hang fails and releases the
    # environment instead of sitting on it.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the app, not the workshop. `path: .` uploads the whole
      # repository, which was a fair trade at fifteen megabytes and stopped
      # being one the moment the section art arrived: art/src holds the
      # full-size originals and their spare generations, forty-five megabytes
      # that no browser ever asks for, because what the book loads is the
      # prepared art in art/ at a fifth of a megabyte each.
      #
      # Sixty megabytes has to be tarred, uploaded and unpacked inside a ten
      # minute timeout, and a deploy that overruns it does not just fail — it
      # holds the environment and every later push waits behind it, which is
      # the exact failure this file already carries a note about.
      - name: Leave the sources behind
        run: rm -rf art/src design tests tools .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000       # 5 minutes, in ms — the default is 10
