<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-label="A braided loaf and a cut loaf cooling on a rack, beside a rolling pin and a crock">
<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

  <!-- table edge -->
  <path d="M8 158 H472" stroke-width="2.2"/>
  <g stroke-width="0.7" opacity=".5">
    <path d="M20 166 H120M140 166 H250M270 166 H360M380 166 H460"/>
  </g>

  <!-- crock, left -->
  <path d="M28 150 V116 q0-6 7-6 h30 q7 0 7 6 v34" stroke-width="2.2"/>
  <path d="M24 110 h58" stroke-width="2.2"/>
  <path d="M46 110 q4-12 10-14" stroke-width="1.3"/>
  <g stroke-width="0.7" opacity=".55">
    <path d="M34 124 V148M42 122 V148M62 122 V148M70 124 V148"/>
  </g>

  <!-- cooling rack -->
  <path d="M104 150 H414" stroke-width="2.2"/>
  <path d="M104 150 v8M414 150 v8M150 150 v8M368 150 v8" stroke-width="1.3"/>
  <g stroke-width="0.7" opacity=".6">
    <path d="M116 150 v-5M132 150 v-5M148 150 v-5M164 150 v-5M180 150 v-5M196 150 v-5
             M212 150 v-5M228 150 v-5M244 150 v-5M260 150 v-5M276 150 v-5M292 150 v-5
             M308 150 v-5M324 150 v-5M340 150 v-5M356 150 v-5M372 150 v-5M388 150 v-5M404 150 v-5"/>
  </g>

  <!-- cut loaf, left: the sliced face -->
  <path d="M118 145 V96 q0-14 16-16 26-3 40 2 v63" stroke-width="2.2"/>
  <path d="M118 96 q26-9 56-14" stroke-width="1.3"/>
  <g stroke-width="0.7" opacity=".5">
    <ellipse cx="134" cy="112" rx="3" ry="2"/><ellipse cx="150" cy="106" rx="2.5" ry="1.8"/>
    <ellipse cx="160" cy="120" rx="3.4" ry="2.2"/><ellipse cx="140" cy="128" rx="2.6" ry="1.9"/>
    <ellipse cx="156" cy="136" rx="2.2" ry="1.6"/><ellipse cx="128" cy="138" rx="2" ry="1.5"/>
  </g>

  <!-- braided loaf: six strands crossing the axis -->
  <path d="M174 145 q0-42 26-52 34-13 78-13 44 0 78 13 26 10 26 52" stroke-width="2.2"/>
  <path d="M174 145 H382" stroke-width="2.2"/>
  <g stroke-width="1.3">
    <path d="M196 138 q10-30 34-34"/>
    <path d="M226 142 q10-33 34-37"/>
    <path d="M258 143 q10-34 34-37"/>
    <path d="M290 143 q10-33 34-36"/>
    <path d="M322 141 q10-30 34-31"/>
  </g>
  <g stroke-width="0.7" opacity=".55">
    <path d="M206 132 q9-22 27-26M236 136 q9-24 27-28M268 137 q9-25 27-28
             M300 137 q9-24 27-27M332 135 q9-21 27-23"/>
  </g>

  <!-- rolling pin, right -->
  <path d="M398 128 h58 q8 0 8 9 t-8 9 h-58 q-8 0-8-9 t8-9" stroke-width="2.2"/>
  <path d="M390 137 h-14M464 137 h12" stroke-width="2.2"/>
  <g stroke-width="0.7" opacity=".5">
    <path d="M408 130 v14M420 129 v16M432 129 v16M444 130 v14"/>
