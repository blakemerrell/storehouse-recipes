<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-label="A frosted layer cake on a pedestal stand with stacked cookies on either side">
<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

  <!-- table edge -->
  <path d="M8 158 H472" stroke-width="2.2"/>

  <!-- cookies, left stack -->
  <g stroke-width="1.6">
    <path d="M42 152 q22 6 44 0 v-7 q-22 6-44 0 z"/>
    <path d="M42 145 q22 6 44 0 v-7 q-22 6-44 0 z"/>
    <path d="M42 138 q22 6 44 0 v-7 q-22 6-44 0 z"/>
  </g>
  <g stroke-width="0.7" opacity=".6">
    <circle cx="56" cy="133" r="1.6"/><circle cx="70" cy="134" r="1.6"/><circle cx="63" cy="129" r="1.4"/>
  </g>

  <!-- cookie leaning, left -->
  <ellipse cx="104" cy="146" rx="15" ry="13" stroke-width="1.6" transform="rotate(-16 104 146)"/>
  <g stroke-width="0.7" opacity=".6">
    <circle cx="99" cy="142" r="1.6"/><circle cx="109" cy="148" r="1.6"/><circle cx="106" cy="139" r="1.4"/>
  </g>

  <!-- pedestal stand -->
  <path d="M146 120 H334" stroke-width="2.2"/>
  <path d="M146 120 q94 12 188 0" stroke-width="2.2"/>
  <path d="M228 122 v18 q-8 6-8 12 h40 q0-6-8-12 v-18" stroke-width="2.2"/>
  <path d="M204 152 q36 8 72 0" stroke-width="2.2"/>
  <g stroke-width="0.7" opacity=".5">
    <path d="M212 148 q28 6 56 0M232 126 v12M248 126 v12"/>
  </g>

  <!-- cake body -->
  <path d="M164 118 V72 q0-10 76-10 t76 10 v46" stroke-width="2.2"/>
  <path d="M164 72 q76 12 152 0" stroke-width="1.3"/>

  <!-- piped swag, upper and lower -->
  <g stroke-width="1.3">
    <path d="M170 88 q18 12 36 0 18 12 36 0 18 12 36 0 18 12 32 0"/>
    <path d="M170 106 q18 12 36 0 18 12 36 0 18 12 36 0 18 12 32 0"/>
  </g>
  <g stroke-width="0.7" opacity=".6">
    <circle cx="188" cy="94" r="1.6"/><circle cx="224" cy="94" r="1.6"/>
    <circle cx="260" cy="94" r="1.6"/><circle cx="296" cy="94" r="1.6"/>
  </g>

  <!-- shell border along the top rim -->
  <g stroke-width="1.3">
    <path d="M166 70 q8-8 16 0 8-8 16 0 8-8 16 0 8-8 16 0 8-8 16 0 8-8 16 0 8-8 16 0 8-8 16 0 8-8 14 0"/>
  </g>

  <!-- chocolate: dense hatch across the sides -->
  <g stroke-width="0.7" opacity=".45">
    <path d="M176 78 V116M186 76 V117M196 75 V117M206 74 V118M216 73 V118M226 73 V118
             M236 72 V118M246 72 V118M256 73 V118M266 73 V118M276 74 V118M286 75 V117
             M296 76 V117M306 78 V116"/>
  </g>

  <!-- cookies, right -->
  <g stroke-width="1.6">
    <path d="M370 152 q22 6 44 0 v-7 q-22 6-44 0 z"/>
    <path d="M370 145 q22 6 44 0 v-7 q-22 6-44 0 z"/>
  </g>
  <ellipse cx="440" cy="144" rx="15" ry="13" stroke-width="1.6" transform="rotate(14 440 144)"/>
  <g stroke-width="0.7" opacity=".6">
    <circle cx="384" cy="140" r="1.6"/><circle cx="400" cy="141" r="1.6"/>
    <circle cx="435" cy="140" r="1.6"/><circle cx="445" cy="147" r="1.6"/>
  </g>

</g>
</svg>
