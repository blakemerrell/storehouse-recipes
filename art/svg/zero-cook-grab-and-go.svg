  <path d="M354 98 q14-10 22-4 -4 10-16 10" stroke-width="1.3"/>
  <g stroke-width="0.7" opacity=".45">
    <path d="M332 122 q-2 16 6 26M342 116 q-4 18 2 30M368 118 q4 16-2 28M376 124 q2 14-4 22"/>
  </g>

  <!-- spoon -->
  <ellipse cx="424" cy="130" rx="11" ry="15" stroke-width="1.6" transform="rotate(22 424 130)"/>
  <path d="M432 143 q10 8 16 12" stroke-width="2.2"/>
  <path d="M419 124 q4-6 10-2" stroke-width="0.7" opacity=".6"/>

</g>
</svg>
